<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Body Atlas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%227%22 r=%225%22 fill=%22%2317252d%22/%3E%3Crect x=%2211%22 y=%2214%22 width=%2210%22 height=%2216%22 rx=%224%22 fill=%22%233346c4%22/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <aside id="panel" aria-label="Study panel">
        <header class="brand">
          <h1>Body Atlas</h1>
          <p id="count" class="muted">Loading models…</p>
          <div class="mode-switch" role="group" aria-label="Mode">
            <button type="button" data-mode="explore" aria-pressed="true">Explore</button>
            <button type="button" data-mode="quiz" aria-pressed="false">Quiz <kbd>Q</kbd></button>
          </div>
        </header>

        <section id="quiz" class="quiz" aria-label="Quiz" aria-live="polite"></section>

        <div class="search" role="search">
          <label for="search-input" class="visually-hidden">Find a structure</label>
          <input id="search-input" type="search" placeholder="Find a structure, e.g. femur" autocomplete="off"
            aria-controls="search-results" aria-expanded="false" />
          <kbd class="search-key" aria-hidden="true">/</kbd>
          <ul id="search-results" role="listbox" hidden></ul>
        </div>

        <section class="systems" aria-labelledby="systems-h">
          <h2 id="systems-h">Systems</h2>
          <ul id="system-list"></ul>
        </section>

        <section id="info" class="info" aria-live="polite"></section>

        <footer class="credit">
          Models: <a href="https://lifesciencedb.jp/bp3d/" target="_blank" rel="noopener">BodyParts3D</a>,
          © 2008 Life Science Integrated Database Center,
          <a href="https://creativecommons.org/licenses/by-sa/2.1/jp/deed.en" target="_blank" rel="noopener">CC BY-SA 2.1 JP</a>.
          Simplified for the web.
        </footer>
      </aside>

      <main id="stage">
        <canvas id="view" aria-label="3D anatomy view. Drag to rotate, scroll to zoom, click a structure to select it."></canvas>
        <svg id="leaders" aria-hidden="true"></svg>
        <div id="labels" aria-hidden="true"></div>
        <div id="hover" role="tooltip" hidden></div>
        <div id="quiz-banner" hidden></div>
        <div id="quiz-cursor" hidden aria-hidden="true"></div>

        <div id="scale" aria-label="Zoom scale">
          <ol id="tiers"></ol>
          <div class="bar"><span id="bar-line"></span><span id="bar-text"></span></div>
        </div>

        <div class="view-actions">
          <button id="reset-view" type="button">Reset view</button>
        </div>
        <div id="loading">Loading models…</div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
